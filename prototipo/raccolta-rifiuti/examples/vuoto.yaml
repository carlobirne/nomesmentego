# Configurazione "Raccolta rifiuti" (versione 1)
# Reimportala nell'app da Stampa e backup > Importa.
# Giorni: lun mar mer gio ven sab dom = giorni di RITIRO.
# inizioCiclo: un lunedì in cui comincia la prima settimana della lista.
# Eccezioni: azione annulla | sposta (con nuovaData) | aggiungi. Senza "rifiuti" vale per tutti.

