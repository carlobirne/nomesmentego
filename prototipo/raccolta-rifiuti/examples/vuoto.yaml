    nome: Umido
    colore: "#6b3f1f"
    nota: ""
  - id: secco
    nome: Secco
    colore: "#4d5257"
    nota: ""
  - id: plastica
    nome: Plastica e lattine
    colore: "#f2c230"
    nota: ""
  - id: carta
    nome: Carta e cartone
    colore: "#22579a"
    nota: ""
  - id: vetro
    nome: Vetro
    colore: "#2f7d4f"
    nota: ""
settimane:
  - nome: Settimana A
    descrizione: ""
    giorni: {}
  - nome: Settimana B
    descrizione: ""
    giorni: {}
eccezioni: []
