<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#efe6d2">
<meta name="referrer" content="no-referrer">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Promemoria">
<title>Nomesmentego</title>
<meta name="description" content="Promemoria periodici per la famiglia: spazzatura, auto, scadenze, mercato. Sul calendario del telefono.">
<link rel="icon" href="/icone/icona.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icone/icona-180.png">
<link id="manifest" rel="manifest" href="/manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Caveat:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/app.css">
</head>
<body>
<!-- filtro che rende irregolare il tratto dei disegni, come a mano -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <filter id="schizzo" x="-10%" y="-10%" width="120%" height="120%">
    <feTurbulence type="fractalNoise" baseFrequency="0.045" numOctaves="2" seed="7" result="rumore"/>
    <feDisplacementMap in="SourceGraphic" in2="rumore" scale="2.4" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
</svg>
<div id="app" class="wrap">
  <header class="top">
    <div class="title-row">
      <a class="app-title" id="titoloLink" href="/"><svg class="disegno marchio" viewBox="0 0 48 48" aria-hidden="true" focusable="false"><g fill="none" stroke="var(--tratto)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 24Q24 8 42 24Q24 40 6 24Z" fill="var(--carta)"/><circle cx="24" cy="24" r="6" fill="var(--m-rosso)"/><circle cx="25" cy="25" r="2.4" fill="var(--pupilla)" stroke="none"/><path d="M24 10V4M14 12.5L11 8M34 12.5L37 8"/></g></svg><span id="titolo">Nomesmentego</span></a>
      <span class="stato-salvataggio" id="statoSalvataggio" role="status" aria-live="polite"></span>
    </div>
    <nav class="tabs hidden" id="schede" aria-label="Sezioni">
      <a data-scheda="oggi" href="#oggi">Oggi</a>
      <a data-scheda="promemoria" href="#promemoria">Promemoria</a>
      <a data-scheda="calendario" href="#calendario">Schema</a>
      <a data-scheda="condividi" href="#condividi">Telefono e condivisione</a>
    </nav>
  </header>
  <main id="vista"><p class="muted">Caricamento…</p></main>
</div>
<input type="file" id="fileImport" accept=".json,.yaml,.yml,.txt,application/json,text/plain" class="hidden">
<noscript><p style="padding:16px">Per usare Nomesmentego serve JavaScript attivo nel browser.</p></noscript>
<script type="module" src="/js/app.js"></script>
</body>
</html>
