# Prova il codice e lo pubblica su Cloudflare a ogni push su main.
# Serve configurare una volta, in Settings › Secrets and variables › Actions:
#   CLOUDFLARE_API_TOKEN   token con il modello "Edit Cloudflare Workers" + permesso "D1: Edit"
#   CLOUDFLARE_ACCOUNT_ID  l'id del tuo account Cloudflare
#   CODICE_INVITO          (facoltativo) parola da chiedere a chi crea una nuova bacheca
#   TELEGRAM_BOT_TOKEN     (facoltativo) token del bot creato con @BotFather: attiva gli avvisi su Telegram
#   BREVO_API_KEY          (facoltativo) chiave API di Brevo per mandare le email (oppure RESEND_API_KEY)
#   EMAIL_MITTENTE         (con la chiave sopra) indirizzo mittente verificato sul servizio di invio
#   EMAIL_NOME             (facoltativo) nome del mittente, es. "Promemoria di famiglia"
name: Test e pubblicazione

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # il link dell'app compare in alto nella pagina dell'esecuzione e in "Deployments" del repository
    environment:
      name: produzione
      url: ${{ steps.pubblica.outputs.url }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Database D1 (lo crea la prima volta)
        run: node scripts/prepara-d1.mjs
      - name: Aggiorna le tabelle
        run: npx wrangler d1 migrations apply DB --remote
      - name: Pubblica
        id: pubblica
        run: |
          npx wrangler deploy | tee deploy.log
          URL=$(grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' deploy.log | head -n 1)
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          {
            echo "## ✅ App pubblicata"
            echo ""
            echo "Apri: **$URL**"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Codice di invito
        env:
          CODICE_INVITO: ${{ secrets.CODICE_INVITO }}
        run: |
          if [ -n "$CODICE_INVITO" ]; then
            printf '%s' "$CODICE_INVITO" | npx wrangler secret put CODICE_INVITO
          else
            echo "Nessun codice di invito: chiunque conosca l'indirizzo può creare una bacheca."
          fi
      - name: Email
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_MITTENTE: ${{ secrets.EMAIL_MITTENTE }}
          EMAIL_NOME: ${{ secrets.EMAIL_NOME }}
        run: |
          caricati=0
          for nome in BREVO_API_KEY RESEND_API_KEY EMAIL_MITTENTE EMAIL_NOME; do
            valore="${!nome}"
            if [ -n "$valore" ]; then printf '%s' "$valore" | npx wrangler secret put "$nome" > /dev/null && caricati=$((caricati+1)); fi
          done
          if [ -n "$EMAIL_MITTENTE" ] && { [ -n "$BREVO_API_KEY" ] || [ -n "$RESEND_API_KEY" ]; }; then
            echo "Email attive (mittente $EMAIL_MITTENTE)."
            echo "Email: attive, mittente **$EMAIL_MITTENTE**" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Email non configurate: servono EMAIL_MITTENTE e BREVO_API_KEY (o RESEND_API_KEY)."
          fi
      - name: Bot Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          URL_APP: ${{ steps.pubblica.outputs.url }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ]; then
            echo "Nessun TELEGRAM_BOT_TOKEN: avvisi su Telegram disattivati."
            exit 0
          fi
          printf '%s' "$TELEGRAM_BOT_TOKEN" | npx wrangler secret put TELEGRAM_BOT_TOKEN
          # stesso segreto calcolato dal Worker (worker/telegram.js, segretoWebhook)
          SEGRETO=$(printf 'nomesmentego-webhook:%s' "$TELEGRAM_BOT_TOKEN" | sha256sum | cut -c1-48)
          API="https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN"
          # chiamata alle Bot API: mostra il motivo dell'errore (la "description" di Telegram)
          # e riprova; un errore qui non deve far fallire la pubblicazione, già fatta
          tg() {
            for i in 1 2 3; do
              R=$(curl -sS "$API/$1" -H 'content-type: application/json' -d "$2" 2>&1 || true)
              if printf '%s' "$R" | grep -q '"ok":true'; then return 0; fi
              echo "Telegram $1, tentativo $i: $(printf '%s' "$R" | node -pe 'const t=require("fs").readFileSync(0,"utf8"); try { JSON.parse(t).description } catch { t.slice(0, 200) }')"
              sleep 5
            done
            return 1
          }
          OK=1
          tg setWebhook "{\"url\":\"$URL_APP/telegram/webhook\",\"secret_token\":\"$SEGRETO\",\"allowed_updates\":[\"message\",\"callback_query\",\"my_chat_member\"],\"drop_pending_updates\":true}" || OK=0
          COMANDI='{"commands":[{"command":"oggi","description":"Cosa c'"'"'è da ricordare oggi"},{"command":"stop","description":"Non ricevere più avvisi qui"}]'
          tg setMyCommands "$COMANDI,\"language_code\":\"it\"}" || OK=0
          tg setMyCommands "$COMANDI}" || OK=0
          if [ "$OK" = 0 ]; then
            echo "::warning title=Bot Telegram::Non sono riuscito a registrare il webhook o i comandi su Telegram (motivo qui sopra). L'app è pubblicata; il bot continua a usare la registrazione precedente. Rilancia la pubblicazione più tardi."
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Bot Telegram: ⚠️ registrazione del webhook non riuscita, vedi il log" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          NOME=$(curl -fsS "$API/getMe" | node -pe 'JSON.parse(require("fs").readFileSync(0)).result.username')
          echo "Bot Telegram collegato: @$NOME"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Bot Telegram: **@$NOME** (webhook registrato)" >> "$GITHUB_STEP_SUMMARY"
